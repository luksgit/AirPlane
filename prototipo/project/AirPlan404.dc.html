<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;font-family:Nunito,system-ui,sans-serif;color:#1E2A3A}a{color:#1F6FC9}a:hover{color:#185AA3}*:focus-visible{outline:3px solid rgba(31,111,201,.6);outline-offset:2px}
@keyframes ap-flutua{0%,100%{transform:translateX(0)}50%{transform:translateX(48px)}}
@keyframes ap-perdido{0%,100%{transform:translate(0,0) rotate(-18deg)}50%{transform:translate(14px,-12px) rotate(-8deg)}}
@media (prefers-reduced-motion: reduce){[data-anim]{animation:none!important}}</style>
</helmet>
<div style="width:100%;height:100%;position:relative;overflow:hidden;container-type:inline-size;background:linear-gradient(180deg,#5D7896 0%,#8EA6BF 50%,#D5E1EC 100%);display:flex;align-items:safe center;justify-content:safe center;overflow-y:auto;padding:24px 16px;font-family:Nunito,system-ui,sans-serif;color:#1E2A3A">
  <sc-for list="{{ nuvens }}" as="n" hint-placeholder-count="0">
    <svg data-anim="true" aria-hidden="true" viewBox="0 0 200 100" style="position:absolute;left:{{ n.x }};top:{{ n.y }};width:{{ n.w }};opacity:{{ n.o }};animation:ap-flutua {{ n.d }} ease-in-out infinite;pointer-events:none"><g style="fill:#3E5470"><circle cx="62" cy="62" r="32"></circle><circle cx="104" cy="44" r="40"></circle><circle cx="148" cy="64" r="28"></circle><rect x="36" y="58" width="134" height="36" rx="18"></rect></g></svg>
  </sc-for>
  <main style="position:relative;z-index:1;width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:0">
    <div aria-hidden="true" style="position:relative;width:220px;height:130px;margin-bottom:-6px">
      <svg viewBox="0 0 220 130" style="position:absolute;inset:0;width:100%;height:100%"><path d="M10 110 C 50 120, 60 60, 100 70 S 150 120, 160 60" style="fill:none;stroke:#fff;stroke-width:2.5;stroke-dasharray:6 8;stroke-linecap:round;opacity:.8"></path></svg>
      <svg data-anim="true" width="64" height="64" viewBox="0 0 24 24" style="position:absolute;right:14px;top:4px;animation:ap-perdido 5s ease-in-out infinite;fill:#fff;stroke:#1E2A3A;stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 6px 8px rgba(30,42,58,.25))"><path d="m22 2-7 20-4-9-9-4Z"></path><path d="M22 2 11 13"></path></svg>
    </div>
    <div style="width:100%;background:#fff;border-radius:20px;padding:36px clamp(22px,3cqw,36px) 32px;box-shadow:0 12px 32px rgba(30,42,58,.25);display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px">
      <span style="font-size:13px;font-weight:800;letter-spacing:.12em;color:#5B6B7F">ERRO 404</span>
      <h1 style="margin:0;font-size:32px;font-weight:800;line-height:1.15">Turbulência! 🌩️</h1>
      <p style="margin:0;font-size:16px;line-height:1.5;color:#5B6B7F;text-wrap:pretty">Não encontramos a página que você procurava.</p>
      <a href="#" onClick="{{ voltar }}" style="margin-top:14px;height:48px;padding:0 24px;border-radius:10px;background:#1F6FC9;color:#fff;font-size:16px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:8px" style-hover="background:#185AA3;color:#fff">{{ botao }}</a>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1440px&quot;,&quot;height&quot;:&quot;900px&quot;},&quot;mobile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;logado&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const mob = !!this.props.mobile;
    return {
      voltar: e => { e.preventDefault(); this.props.onVoltar && this.props.onVoltar(); },
      botao: this.props.logado === false ? 'Voltar para o Login' : 'Voltar para o Hangar',
      nuvens: mob
        ? [{ x: '-50px', y: '60px', w: '200px', o: .45, d: '50s' }, { x: '220px', y: '150px', w: '170px', o: .35, d: '62s' }, { x: '10px', y: '690px', w: '240px', o: .4, d: '56s' }]
        : [{ x: '3%', y: '10%', w: '300px', o: .45, d: '52s' }, { x: '70%', y: '6%', w: '240px', o: .35, d: '64s' }, { x: '78%', y: '60%', w: '320px', o: .4, d: '58s' }, { x: '-4%', y: '70%', w: '360px', o: .5, d: '70s' }, { x: '36%', y: '84%', w: '240px', o: .3, d: '54s' }],
    };
  }
}
</script>
</body>
</html>
