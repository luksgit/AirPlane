<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</helmet>
<div role="status" style="display:flex;align-items:center;gap:12px;width:100%;background:#fff;border-radius:12px;padding:12px 10px 12px 14px;border:1px solid #D6E8F7;box-shadow:0 12px 32px rgba(30,42,58,.18);font-family:Nunito,system-ui,sans-serif;color:#1E2A3A">
  <span aria-hidden="true" style="width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;background:{{ cor }}">
    <sc-if value="{{ eSucesso }}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" style="display:block;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
    <sc-if value="{{ eErro }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" style="display:block;fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg></sc-if>
    <sc-if value="{{ eInfo }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" style="display:block;fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></sc-if>
  </span>
  <span style="flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.35">{{ mensagem }}</span>
  <button onClick="{{ fechar }}" aria-label="Fechar notificação" style="width:32px;height:32px;flex:none;border:none;border-radius:8px;background:transparent;color:#5B6B7F;display:grid;place-items:center;cursor:pointer" style-hover="background:#EEF3F8;color:#1E2A3A">
    <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;360px&quot;,&quot;height&quot;:&quot;80px&quot;},&quot;tipo&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;sucesso&quot;,&quot;erro&quot;,&quot;info&quot;],&quot;default&quot;:&quot;sucesso&quot;,&quot;tsType&quot;:&quot;'sucesso'|'erro'|'info'&quot;},&quot;mensagem&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Quadro criado&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onFechar&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const tipo = this.props.tipo ?? 'sucesso';
    const cores = { sucesso: '#2EAD6B', erro: '#D13B40', info: '#1F6FC9' };
    return {
      cor: cores[tipo] || cores.info,
      eSucesso: tipo === 'sucesso', eErro: tipo === 'erro', eInfo: tipo === 'info',
      mensagem: this.props.mensagem ?? 'Quadro criado',
      fechar: () => this.props.onFechar && this.props.onFechar(),
    };
  }
}
</script>
</body>
</html>
