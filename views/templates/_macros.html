{# Peças de HTML reaproveitadas pelos formulários. #}

{% macro campo_senha(id, rotulo, placeholder, autocomplete, forca=false) %}
<div class="campo">
  <label class="campo__rotulo" for="{{ id }}">{{ rotulo }}</label>
  <div class="campo__caixa">
    <input class="campo__entrada campo__entrada--senha" id="{{ id }}" name="{{ id }}" type="password" placeholder="{{ placeholder }}" autocomplete="{{ autocomplete }}" maxlength="128">
    <button type="button" class="botao-icone campo__olho" aria-label="Mostrar senha" aria-pressed="false" aria-controls="{{ id }}">
      <svg data-olho="aberto" class="icone" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      <svg data-olho="fechado" class="icone" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path><path d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path><path d="M2 2l20 20"></path></svg>
    </button>
  </div>
  {% if forca %}
  <div class="forca" id="{{ id }}-forca" data-forca="0" aria-live="polite" hidden>
    <div class="forca__barras" aria-hidden="true"><span class="forca__barra"></span><span class="forca__barra"></span><span class="forca__barra"></span></div>
    <span class="forca__texto"></span>
  </div>
  {% endif %}
</div>
{% endmacro %}

{% macro icone_alerta() %}
<svg class="icone" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>
{% endmacro %}
