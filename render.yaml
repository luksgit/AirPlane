# Deploy do AirPlan no Render (Web Service, plano grátis).
# O banco fica no Supabase: a DATABASE_URL (Session pooler, porta 5432) é
# colada no painel do Render, nunca neste arquivo.
services:
  - type: web
    name: airplan
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: FLASK_ENV
        value: production
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
